<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Books — Saurav Das</title>
  <meta name="description" content="Short book reviews from Saurav Das — soil, systems, economics, and the occasional novel." />
  <link rel="canonical" href="https://sauravdas.me/writings/books" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Books — Saurav Das" />
  <meta property="og:description" content="Short book reviews — soil, systems, economics, and the occasional novel." />
  <meta property="og:url" content="https://sauravdas.me/writings/books" />
  <meta property="og:image" content="https://sauravdas.me/api/og?title=Books&kicker=Reviews" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    :root {
      --bg: #ffffff; --ink: #111111; --ink-2: #333333; --muted: #6b6b6b;
      --line: #e7e7e7; --line-strong: #c9c9c9; --green: #1f5c3a; --green-deep: #174630; --green-soft: #eef4ef; --tint: #f7f7f5;
      --font: "Source Serif 4", Georgia, "Times New Roman", serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font: 400 17px/1.65 var(--font); font-variation-settings: "opsz" 16; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    ::selection { background: var(--green); color: #fff; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 4px; }
    .wrap { width: min(720px, calc(100% - 48px)); margin: 0 auto; }

    .top { border-bottom: 1px solid var(--line); }
    .top-inner { display: flex; justify-content: space-between; align-items: center; min-height: 60px; gap: 16px; }
    .home { text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
    .home .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .top nav { display: flex; gap: 4px; }
    .top nav a { text-decoration: none; color: var(--ink-2); font-size: 15px; padding: 8px 10px; border-radius: 6px; }
    .top nav a:hover { background: var(--tint); color: var(--ink); }

    header.page { padding: clamp(40px, 6vw, 72px) 0 clamp(24px, 4vw, 40px); }
    .kicker { color: var(--green); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; margin-bottom: 12px; }
    h1 { margin: 0 0 16px; font-weight: 500; font-size: clamp(34px, 5vw, 52px); line-height: 1.08; letter-spacing: -0.015em; font-variation-settings: "opsz" 52; }
    .lede { margin: 0; color: var(--ink-2); font-size: 18px; max-width: 56ch; text-wrap: pretty; }

    .shelf { padding-bottom: 72px; }
    .empty { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 28px; color: var(--ink-2); background: var(--tint); }
    .empty a { color: var(--green); font-weight: 600; text-decoration: none; border-bottom: 1px solid transparent; }
    .empty a:hover { border-bottom-color: currentColor; }

    /* One review */
    .book { padding: 32px 0; border-top: 1px solid var(--line); }
    .book:first-of-type { border-top: 0; padding-top: 8px; }
    .book-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
    .book h2 { margin: 0 0 4px; font-weight: 500; font-size: 26px; line-height: 1.2; font-variation-settings: "opsz" 28; }
    .book .by { margin: 0 0 14px; color: var(--green); font-weight: 600; font-size: 15px; }
    .book p { margin: 0 0 14px; color: var(--ink-2); }
    .book p:last-child { margin-bottom: 0; }
    .book .verdict { display: inline-block; padding: 5px 11px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 600; font-size: 14px; margin-top: 4px; }

    footer { border-top: 1px solid var(--line); padding: 28px 0 90px; color: var(--muted); font-size: 14px; }
    footer .row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; }
    footer a { color: var(--ink-2); text-decoration: none; }
    footer a:hover { color: var(--green); }
  </style>
</head>
<body>
  <div class="top">
    <div class="wrap top-inner">
      <a class="home" href="/"><span class="dot" aria-hidden="true"></span>Saurav Das</a>
      <nav aria-label="Nearby">
        <a href="/writings/watching.html">Watching</a>
        <a href="/#writing">Essays</a>
      </nav>
    </div>
  </div>

  <main class="wrap">
    <header class="page">
      <p class="kicker">Reading</p>
      <h1>Books</h1>
      <p class="lede">Short reviews of what I've been reading &mdash; mostly soil, systems, economics, and the occasional novel. New entries land here as I finish them.</p>
    </header>

    <section class="shelf" aria-label="Reviews">
      <div class="empty">The first reviews are on their way. In the meantime, <a href="mailto:saurav12das@gmail.com?subject=Book%20recommendation">send me a recommendation</a>.</div>

      <!--
        TO ADD A REVIEW: copy the <article> below into the section above,
        replace the placeholders, and delete the .empty div once the shelf
        has at least one book. Newest first.

      <article class="book">
        <div class="book-meta"><span>Read 2026</span><span>·</span><span>Nonfiction</span></div>
        <h2>Book Title</h2>
        <p class="by">Author Name</p>
        <p>Your review. What the book argues, where it's strongest, where it loses you, and who should read it.</p>
        <span class="verdict">Worth your time</span>
      </article>
      -->
    </section>
  </main>

  <footer>
    <div class="wrap row">
      <span>&copy; <span id="y"></span> Saurav Das</span>
      <span><a href="/">Back home</a></span>
    </div>
  </footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
  <script defer src="/views.js"></script>
  <script defer src="/dock.js"></script>
</body>
</html>
